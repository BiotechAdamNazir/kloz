<style>
/* Layout: one exercise-book sheet (red margin rule) with a floating word tray and a check bar; each word class has its own pen colour. */
:root{
  --bg:#eaeff6; --sheet:#ffffff; --ink:#15213b; --muted:#56627c; --line:#d3dbe8; --rule:#e4e9f2;
  --margin:#d24a43; --accent:#2348c4; --accent-soft:#e2e8fb;
  --c1:#0f7a68; --c2:#c4471b; --c3:#7a3fd6; --c4:#9a6400; --c5:#1f56d6; --c6:#b8226a; --c7:#5f6b80;
  --ok:#1b7d44; --ok-soft:#dff2e6; --bad:#c0352d; --bad-soft:#fbe5e3; --near:#956500; --near-soft:#fbefd2;
  --display:"Young Serif",Georgia,"DejaVu Serif",serif;
  --serif:"Literata",Georgia,"DejaVu Serif","Times New Roman",serif;
  --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131c; --sheet:#161d2a; --ink:#e6ebf4; --muted:#9ba7bf; --line:#2a3447; --rule:#212a3b;
  --margin:#ff7b72; --accent:#8fa8ff; --accent-soft:#222c49;
  --c1:#4fd1b5; --c2:#ff8d5e; --c3:#b69bff; --c4:#e6b14c; --c5:#82a6ff; --c6:#f27bb4; --c7:#9aa6bd;
  --ok:#5fd394; --ok-soft:#17321f; --bad:#ff8b80; --bad-soft:#3a1d1b; --near:#f1c35c; --near-soft:#392e13;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131c; --sheet:#161d2a; --ink:#e6ebf4; --muted:#9ba7bf; --line:#2a3447; --rule:#212a3b;
  --margin:#ff7b72; --accent:#8fa8ff; --accent-soft:#222c49;
  --c1:#4fd1b5; --c2:#ff8d5e; --c3:#b69bff; --c4:#e6b14c; --c5:#82a6ff; --c6:#f27bb4; --c7:#9aa6bd;
  --ok:#5fd394; --ok-soft:#17321f; --bad:#ff8b80; --bad-soft:#3a1d1b; --near:#f1c35c; --near-soft:#392e13;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}.c6{--c:var(--c6)}.c7{--c:var(--c7)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:18px 150px;display:grid;gap:14px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.draft{border:1px solid color-mix(in srgb,var(--near) 55%,var(--line));background:var(--near-soft);border-radius:10px;padding:8px 12px;font-size:.88rem}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px 16px 16px 4px;min-width:0;
  padding-block:22px 28px;padding-inline:58px 28px;
  background-image:linear-gradient(to right,transparent 40px,var(--margin) 40px,var(--margin) 41.5px,transparent 41.5px);
  box-shadow:0 1px 0 var(--line),0 18px 40px -28px color-mix(in srgb,var(--ink) 40%,transparent)}
@media (max-width:560px){.sheet{padding-inline:36px 14px;background-image:linear-gradient(to right,transparent 22px,var(--margin) 22px,var(--margin) 23.5px,transparent 23.5px)}}
h1{font:400 clamp(24px,5vw,34px)/1.12 var(--display);margin:4px 0 6px;text-wrap:balance}
.q{font:italic .98rem/1.55 var(--serif);color:var(--muted);margin:0 0 10px;max-width:68ch}
.idline{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;font-size:.9rem;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:12px;margin-bottom:14px}
.idline label{display:flex;gap:6px;align-items:end}
.idline input{border:0;border-bottom:1.5px solid var(--line);background:transparent;min-width:11em;padding:2px 2px;font-size:16px;color:var(--ink)}
.howto{font-size:.88rem;color:var(--muted);margin:0 0 14px}
.box{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 18px;display:grid;gap:8px;background:var(--sheet)}
.box .h{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.words{display:flex;flex-wrap:wrap;gap:7px}
.w{cursor:pointer;font:1rem var(--serif);border:1px solid var(--line);border-radius:9px;padding:4px 11px;background:transparent;transition:opacity .2s,transform .15s,background .15s}
.w:hover{background:var(--accent-soft)}
.w:active{transform:scale(.96)}
.w.used{opacity:.32;text-decoration:line-through}
.essay{font:1.1rem/2.3 var(--serif);max-width:70ch}
.essay p{margin:0 0 .8em}
.gap{display:inline-block;position:relative;margin:0 3px 0 2px;line-height:1.2;vertical-align:baseline}
.gap input{-webkit-appearance:none;appearance:none;border:0;border-bottom:2px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 6%,transparent);
  border-radius:4px 4px 0 0;font:16px var(--serif);text-align:center;padding:0 5px;height:1.6em;width:6.5em;max-width:62vw;transition:background .2s,border-color .2s,color .2s}
.gap input:focus{background:var(--accent-soft);outline:none}
.gap .num{position:absolute;left:1px;top:-1.05em;font:700 .62rem/1 var(--ui);color:var(--muted)}
.gap .lab{position:absolute;left:-1em;right:-1em;top:100%;margin-top:1px;text-align:center;font:700 .56rem/1 var(--ui);letter-spacing:.03em;color:var(--c,var(--accent));white-space:nowrap}
.gap.ok input{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.gap.bad input{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gap.near input{background:var(--near-soft);border-color:var(--near);color:var(--near)}
.gap.shown input{border-bottom-style:dashed;color:var(--accent)}
.gap .mark{position:absolute;right:-.2em;top:-1em;font:700 .75rem var(--ui)}
.gap.ok .mark{color:var(--ok)} .gap.bad .mark{color:var(--bad)} .gap.near .mark{color:var(--near)}
@media (prefers-reduced-motion:no-preference){
  .gap{animation:drop .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d,0s)}
  @keyframes drop{from{opacity:.2;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .gap.bad{animation:shake .42s both}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .gap.ok{animation:pop .4s both}
  @keyframes pop{50%{transform:scale(1.08)}}
  .fi{animation:grow .8s cubic-bezier(.2,.9,.3,1) both}
  @keyframes grow{from{width:0}}
  .score{animation:rise .5s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.96)}}
}
.challenge{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.challenge h2{font:700 .74rem var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.challenge p{margin:0 0 8px;font-size:.95rem}
.challenge textarea{width:100%;min-height:7em;border:1px solid var(--line);border-radius:10px;background:transparent;padding:10px;font:16px/1.6 var(--serif);color:var(--ink);resize:vertical}
.result{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.score{font:400 2.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.score small{font:700 .85rem var(--ui);color:var(--muted);margin-left:8px}
.who{font-size:.86rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bar{display:grid;gap:4px;font-size:.84rem}
.tr{height:7px;border-radius:4px;background:var(--rule);overflow:hidden}
.fi{height:100%;background:var(--c,var(--accent));border-radius:4px}
.keylist{display:grid;gap:6px;font-size:.92rem}
.keylist div{border-left:3px solid var(--c,var(--accent));padding:3px 10px}
.keylist b{font-family:var(--serif)}
.keylist .n{color:var(--muted);font-size:.8rem;margin-right:4px}
.keylist .o{color:var(--muted);font-size:.85rem;display:block}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.dock .in{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.prog{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);flex:1 1 180px;min-width:0}
.prog .tr{flex:1;min-width:60px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{cursor:pointer;border-radius:99px;padding:9px 16px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:.92rem;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--sheet)}
.btn:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 15px;border-radius:10px;font-size:.9rem;z-index:20;max-width:90vw}
.empty{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center}
.empty h1{margin-bottom:8px}
.foot{font-size:.76rem;color:var(--muted);text-align:center}

.fab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--dockh,64px) + 12px);z-index:6;cursor:pointer;
  display:flex;gap:8px;align-items:center;border:0;border-radius:99px;padding:11px 16px;background:var(--accent);color:var(--sheet);font-weight:700;font-size:.95rem;
  box-shadow:0 10px 26px -10px color-mix(in srgb,var(--ink) 60%,transparent);transition:transform .2s,opacity .2s}
.fab:active{transform:scale(.95)}
.fab .ct{background:var(--sheet);color:var(--accent);border-radius:99px;padding:0 7px;font-size:.8rem;min-width:1.7em;text-align:center;font-variant-numeric:tabular-nums}
.fab.off{opacity:0;pointer-events:none;transform:translateY(12px) scale(.9)}
.pop{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--dockh,64px) + 66px);z-index:7;width:min(400px,calc(100vw - 28px));
  max-height:min(48vh,380px);overflow:auto;background:var(--sheet);border:1.5px solid var(--accent);border-radius:16px;padding:10px 12px 12px;display:grid;gap:8px;
  box-shadow:0 18px 40px -16px color-mix(in srgb,var(--ink) 55%,transparent)}
.pop .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pop .x{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:99px;width:34px;height:34px;font-size:1rem;line-height:1}
.pop .tip{font-size:.8rem;color:var(--muted)}
.pop .w{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--ink);font-weight:600}
.pop .w.used{background:transparent}
@media (prefers-reduced-motion:no-preference){
  .pop:not([hidden]){animation:bub .28s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes bub{from{opacity:0;transform:translateY(14px) scale(.96)}}
  .fab .ct.bump{animation:pop .35s both}
}
</style>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- load the worksheet: from the link (#k=...) or from data embedded in this file ---------- */
let D=null, key="kloz:";
try{
  const h=location.hash||"";
  const m=h.match(/[#&]k=([^&]+)/);
  if(m){const raw=LZString.decompressFromEncodedURIComponent(m[1]);D=JSON.parse(raw);key+=m[1].length+":"+m[1].slice(-24)}
}catch(e){D=null}
if(!D){try{D=JSON.parse(document.getElementById("kloz-embedded").textContent)}catch(e){D=null} if(D)key+="emb:"+(D.t||"")}
const ui=D&&D.lang==="en"?{
  name:"Name",date:"Date",box:"Word box",unused:n=>n?`${n} words are not needed`:"",how:"Type in each gap, or tap a gap then tap a word in the box.",
  check:"Check answers",retry:"Try the wrong ones again",show:"Show answers",hide:"Hide answers",filled:(a,b)=>`${a}/${b} filled`,
  score:"Your score",byclass:"By word type",keyh:"Answer key",copy:"Copy my result",copied:"Result copied. Paste it to your teacher.",
  challenge:"Challenge",chdef:"Without looking, rewrite your favourite paragraph from memory.",draft:"Draft: your teacher has not checked this sheet yet.",
  near:"Almost: check your spelling.",empty:"This link is incomplete. Ask your teacher to send it again.",fillsome:"Fill in at least one gap first.",
  saved:"Your answers are saved on this device.",accepted:"also accepted",
  boxbtn:"Word box",close:"Close word box",tip:"Tap a gap, then tap a word."
}:{
  name:"Nama",date:"Tarikh",box:"Kotak kata",unused:n=>n?`${n} perkataan tidak diperlukan`:"",how:"Taip dalam setiap ruang, atau ketik ruang kemudian ketik perkataan dalam kotak.",
  check:"Semak jawapan",retry:"Cuba lagi yang salah",show:"Tunjuk jawapan",hide:"Sembunyi jawapan",filled:(a,b)=>`${a}/${b} diisi`,
  score:"Markah anda",byclass:"Mengikut golongan",keyh:"Skema jawapan",copy:"Salin keputusan",copied:"Keputusan disalin. Tampal dan hantar kepada guru.",
  challenge:"Cabaran",chdef:"Tanpa melihat teks, tulis semula perenggan kegemaran anda.",draft:"Draf: lembaran ini belum disemak oleh guru.",
  near:"Hampir betul: semak ejaan.",empty:"Pautan ini tidak lengkap. Minta guru hantar semula.",fillsome:"Isi sekurang-kurangnya satu ruang dahulu.",
  saved:"Jawapan anda disimpan pada peranti ini.",accepted:"juga diterima",
  boxbtn:"Kotak kata",close:"Tutup kotak kata",tip:"Ketik ruang, kemudian ketik perkataan."
};

if(!D||!Array.isArray(D.P)){
  document.getElementById("app").innerHTML=`<div class="empty"><div class="eyebrow">Kloz Karangan</div><h1>Lembaran tidak dijumpai</h1><p>Pautan ini tidak lengkap. Minta guru hantar semula.<br><span style="color:var(--muted)">This link is incomplete. Ask your teacher to send it again.</span></p></div>`;
  return;
}
document.documentElement.lang=D.lang==="en"?"en":"ms";
document.title=(D.t||"English Cloze")+" · Kloz";

/* D: {t,q,lv,lang,mode:'check'|'key'|'none',wb,lab,P:[[str|gapIndex]],A:[[answer,alt..]],C:[classIdx],CL:[[label,colourSlot]],N:[note],X:[decoys],ch,dr} */
/* CL colour slot goes into a class attribute unescaped, so force it to an integer 1-7 (link data is untrusted). */
const A=D.A||[], n=A.length, CL=(Array.isArray(D.CL)?D.CL:[]).map(c=>[String((c&&c[0])??""),Math.min(7,Math.max(1,parseInt(c&&c[1],10)||5))]), C=D.C||[], N=D.N||[];
const saved=store.get(key)||{};
const st={vals:saved.vals||Array(n).fill(""),name:saved.name||"",ch:saved.ch||"",checked:false,shown:false,res:null};
const save=()=>store.set(key,{vals:st.vals,name:st.name,ch:st.ch});

const norm=s=>String(s||"").normalize("NFC").toLowerCase().replace(/[‘’“”"']/g,"").replace(/[‐-―]/g,"-").replace(/\s*-\s*/g,"-").replace(/[.,;:!?]+$/,"").replace(/\s+/g," ").trim();
function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function grade(i){const v=norm(st.vals[i]);if(!v)return"empty";const ok=(A[i]||[]).map(norm);if(ok.includes(v))return"ok";
  if(v.length>=4&&ok.some(o=>lev(v,o)<=1))return"near";return"bad"}

/* word box: answers + decoys, alphabetical, de-duplicated (counts kept) */
const boxWords=[];
if(D.wb){const all=Array.isArray(D.B)?D.B:A.map(a=>a[0]).concat(D.X||[]);all.slice().sort((a,b)=>a.localeCompare(b,"ms")).forEach(w=>boxWords.push(w))}

const app=document.getElementById("app");
const today=new Date().toLocaleDateString(D.lang==="en"?"en-GB":"ms-MY",{day:"numeric",month:"long",year:"numeric"});
let gi=0;
const paraHTML=D.P.map(p=>"<p>"+p.map(x=>{
  if(typeof x==="number"){const i=x,c=CL[C[i]]||["",5];const d=(gi++%12)*0.035;
    return `<span class="gap c${c[1]}" id="g${i}" style="--d:${d}s"><span class="num">${i+1}</span><input id="in${i}" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Ruang ${i+1}">${D.lab&&c[0]?`<span class="lab">${esc(c[0])}</span>`:""}<span class="mark" aria-hidden="true"></span></span>`}
  return esc(x)}).join("")+"</p>").join("");
app.innerHTML=`
  <div><div class="eyebrow">Kloz · English Cloze${D.lv?" · "+esc(D.lv):""}</div></div>
  ${D.dr?`<div class="draft">${ui.draft}</div>`:""}
  <article class="sheet">
    <h1>${esc(D.t||"")}</h1>
    ${D.q?`<p class="q">${esc(D.q)}</p>`:""}
    <div class="idline"><label>${ui.name}: <input id="nm" autocomplete="name" value="${esc(st.name)}"></label><span>${ui.date}: ${today}</span></div>
    ${D.wb?`<div class="box"><div class="h"><span>${ui.box}</span><span>${ui.unused((D.X||[]).length)}</span></div><div class="words">${boxWords.map((w,k)=>`<button type="button" class="w" data-w="${esc(w)}" data-k="${k}">${esc(w)}</button>`).join("")}</div></div>`:""}
    <p class="howto">${D.wb?ui.how:ui.how.split(",")[0]+"."}</p>
    <div class="essay">${paraHTML}</div>
    <div class="challenge"><h2>${ui.challenge}</h2><p>${esc(D.ch||ui.chdef)}</p><textarea id="chx" aria-label="${ui.challenge}">${esc(st.ch)}</textarea></div>
  </article>
  <section class="result" id="result" hidden aria-live="polite"></section>
  <p class="foot">${ui.saved}</p>
  ${D.wb&&D.fb?`<button type="button" class="fab off" id="fab" aria-expanded="false" aria-controls="pop"><span id="fablab">${ui.boxbtn}</span><span class="ct" id="fabct"></span></button>
  <div class="pop" id="pop" role="dialog" aria-label="${ui.box}" hidden><div class="h"><span>${ui.box}</span><button type="button" class="x" id="popx" aria-label="${ui.close}">✕</button></div>
    <div class="words">${boxWords.map((w,k)=>`<button type="button" class="w" data-w="${esc(w)}" data-k="${k}">${esc(w)}</button>`).join("")}</div><div class="tip">${ui.tip}</div></div>`:""}`;

const inputs=[...document.querySelectorAll(".gap input")];
let focusI=0;
function fit(inp){const len=Math.max(inp.value.length,6);inp.style.width=Math.min(len*0.62+1.6,22)+"em"}
inputs.forEach(inp=>{const i=+inp.dataset.i;inp.value=st.vals[i]||"";fit(inp);
  inp.addEventListener("input",()=>{st.vals[i]=inp.value;fit(inp);clearMark(i);save();refresh()});
  inp.addEventListener("focus",()=>{focusI=i});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const nx=inputs[inputs.indexOf(inp)+1];nx?nx.focus():$("#bCheck").focus()}});
});
$("#nm").addEventListener("input",e=>{st.name=e.target.value;save()});
$("#chx").addEventListener("input",e=>{st.ch=e.target.value;save()});
document.querySelectorAll(".w").forEach(b=>b.addEventListener("mousedown",e=>e.preventDefault()));
document.querySelectorAll(".w").forEach(b=>b.addEventListener("click",()=>{
  const ae=document.activeElement;let i=ae&&ae.matches&&ae.matches(".gap input")?+ae.dataset.i:focusI; const cur=inputs.find(x=>+x.dataset.i===i);
  if(!cur||cur.value){const empty=inputs.find(x=>!x.value);if(!empty){toast(ui.filled(n,n));return}i=+empty.dataset.i}
  const inp=document.getElementById("in"+i);inp.value=b.dataset.w;st.vals[i]=inp.value;fit(inp);clearMark(i);save();refresh();
  const nx=inputs.slice(inputs.indexOf(inp)+1).find(x=>!x.value)||inputs.find(x=>!x.value);(nx||inp).focus();
}));

function clearMark(i){const g=document.getElementById("g"+i);g.classList.remove("ok","bad","near","shown");g.querySelector(".mark").textContent=""}
function refresh(){
  const filled=st.vals.filter(v=>norm(v)).length;
  $("#progtxt").textContent=ui.filled(filled,n);$("#progfi").style.width=(n?filled/n*100:0)+"%";
  /* strike used words in the box: each box word used as many times as typed */
  const used0={};st.vals.forEach(v=>{const k=norm(v);if(k)used0[k]=(used0[k]||0)+1});
  document.querySelectorAll(".words").forEach(box=>{const used={...used0};let left=0;
    box.querySelectorAll(".w").forEach(b=>{const k=norm(b.dataset.w);if(used[k]>0){b.classList.add("used");used[k]--}else{b.classList.remove("used");left++}});
    const ct=document.getElementById("fabct");if(ct&&box.closest("#pop")&&ct.textContent!==String(left)){ct.textContent=left;ct.classList.remove("bump");void ct.offsetWidth;ct.classList.add("bump")}});
}
const canCheck=D.mode!=="none";
$("#dock").hidden=false;
if(!canCheck){$("#bCheck").hidden=true}
function check(){
  if(!st.vals.some(v=>norm(v))){toast(ui.fillsome);return}
  const per={};let ok=0;
  for(let i=0;i<n;i++){const g=grade(i),el=document.getElementById("g"+i);el.classList.remove("ok","bad","near","shown");void el.offsetWidth;
    const m=el.querySelector(".mark");
    if(g==="ok"){el.classList.add("ok");m.textContent="✓";ok++}else if(g==="near"){el.classList.add("near");m.textContent="~";el.title=ui.near}else{el.classList.add("bad");m.textContent="✗"}
    const c=C[i]??0;per[c]=per[c]||[0,0];per[c][1]++;if(g==="ok")per[c][0]++}
  st.checked=true;st.res={ok,per,at:new Date()};renderResult();
  $("#bRetry").hidden=ok===n;$("#bShow").hidden=D.mode!=="key";
  const firstBad=inputs.find(x=>!document.getElementById("g"+x.dataset.i).classList.contains("ok"));
  if(ok===n)toast(D.lang==="en"?"All correct. Well done!":"Semua betul. Syabas!");
  document.getElementById("result").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"nearest"});
}
function renderResult(){
  const r=st.res,el=document.getElementById("result");if(!r){el.hidden=true;return}
  const pct=Math.round(r.ok/n*100);
  const bars=Object.keys(r.per).map(c=>{const [a,b]=r.per[c],cl=CL[c]||["",5];return `<div class="bar c${cl[1]}"><span>${esc(cl[0]||"")} · ${a}/${b}</span><div class="tr"><div class="fi" style="width:${b?a/b*100:0}%"></div></div></div>`}).join("");
  const keyHTML=st.shown?`<div><div class="eyebrow">${ui.keyh}</div><div class="keylist">${A.map((a,i)=>{const cl=CL[C[i]]||["",5];return `<div class="c${cl[1]}"><span class="n">${i+1}</span><b>${esc(a[0])}</b>${a.length>1?` <span class="o" style="display:inline">(${ui.accepted}: ${a.slice(1).map(esc).join(", ")})</span>`:""}${N[i]?`<span class="o">${esc(N[i])}</span>`:""}</div>`}).join("")}</div></div>`:"";
  el.innerHTML=`<div class="eyebrow">${ui.score}</div>
    <div class="score">${r.ok}/${n}<small>${pct}%</small></div>
    <div class="who">${esc(st.name||"—")} · ${r.at.toLocaleString(D.lang==="en"?"en-GB":"ms-MY",{dateStyle:"medium",timeStyle:"short"})}</div>
    ${CL.length>1?`<div class="eyebrow" style="margin-top:4px">${ui.byclass}</div><div class="bars">${bars}</div>`:""}
    <div class="btns"><button class="btn" id="bCopy" type="button">${ui.copy}</button></div>
    ${keyHTML}`;
  el.hidden=false;
  document.getElementById("bCopy").addEventListener("click",copyResult);
}
function copyResult(){
  const r=st.res;const wrong=[];for(let i=0;i<n;i++)if(grade(i)!=="ok")wrong.push(i+1);
  const txt=`*English Cloze* – ${D.t}\n${ui.name}: ${st.name||"—"}\n${ui.score}: *${r.ok}/${n}* (${Math.round(r.ok/n*100)}%)\n`+(wrong.length?(D.lang==="en"?"Wrong: ":"Salah: ")+wrong.join(", ")+"\n":"")+r.at.toLocaleString("en-GB");
  const done=()=>toast(ui.copied);
  try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt))}catch(e){fallback(txt)}
  function fallback(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast(t)}ta.remove()}
}
$("#bCheck").addEventListener("click",check);
$("#bRetry").addEventListener("click",()=>{for(let i=0;i<n;i++)if(grade(i)!=="ok"){st.vals[i]="";const inp=document.getElementById("in"+i);inp.value="";fit(inp);clearMark(i)}
  save();refresh();const f=inputs.find(x=>!x.value);f&&f.focus();});
$("#bShow").addEventListener("click",()=>{st.shown=!st.shown;$("#bShow").textContent=st.shown?ui.hide:ui.show;
  for(let i=0;i<n;i++){const g=document.getElementById("g"+i);if(st.shown&&grade(i)!=="ok"){g.classList.add("shown");g.dataset.prev=st.vals[i];document.getElementById("in"+i).value=A[i][0]}
    else if(!st.shown&&g.classList.contains("shown")){g.classList.remove("shown");document.getElementById("in"+i).value=g.dataset.prev||""}}
  renderResult()});
/* floating word box: bubble hides while the top word box is on screen; opens a copy of the box anywhere else */
(function(){const fab=$("#fab"),pop=$("#pop");if(!fab||!pop)return;
  const dock=$("#dock"),setH=()=>document.documentElement.style.setProperty("--dockh",dock.offsetHeight+"px");setH();
  if(window.ResizeObserver)new ResizeObserver(setH).observe(dock);else addEventListener("resize",setH);
  const open=v=>{pop.hidden=!v;fab.setAttribute("aria-expanded",v);$("#fablab").textContent=v?ui.close.split(" ")[0]:ui.boxbtn};
  fab.addEventListener("mousedown",e=>e.preventDefault());$("#popx").addEventListener("mousedown",e=>e.preventDefault());
  fab.addEventListener("click",()=>open(pop.hidden));$("#popx").addEventListener("click",()=>open(false));
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!pop.hidden)open(false)});
  const top=document.querySelector(".sheet .box");let was=null;
  const sync=()=>{const r=top?top.getBoundingClientRect():null;const vis=!!r&&r.bottom>8&&r.top<innerHeight-dock.offsetHeight;
    if(vis!==was){was=vis;fab.classList.toggle("off",vis);if(vis)open(false)}};
  addEventListener("scroll",sync,{passive:true});addEventListener("resize",sync);sync();
})();
$("#bCheck").textContent=ui.check;$("#bRetry").textContent=ui.retry;$("#bShow").textContent=ui.show;
refresh();
})();
</script>
</body>
</html>
